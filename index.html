<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHOES. - Air Runner</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar navbar-expand-sm bg-white shadow-sm px-3 px-md-5">
    <a class="navbar-brand logo" href="index.html">SHOES.</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav" aria-label="Buka menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="menuNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
      </ul>
    </div>
  </nav>

  <!-- ===== Main ===== -->
  <main class="main-section d-flex align-items-center justify-content-center p-3">

    <!-- Product card JS-->
    <div class="product-card w-100" id="productCard">
      <div class="row g-3 align-items-center">

        <!-- Kolom gambar -->
        <div class="col-md-5">
          <div class="product-image">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Sepatu Runner">
          </div>
        </div>

        <!-- Detail kolom produk -->
        <div class="col-md-7">
          <p class="product-category mb-1">RUNNING SHOES</p>
          <h1 class="product-name">Air Runner</h1>
          <p class="product-desc">Sepatu ringan dan nyaman untuk digunakan saat berolahraga maupun aktivitas sehari-hari.</p>
          <p class="product-price">Rp 899.000</p>

          <p class="color-label mb-2">Pilih warna:</p>
          <div class="d-flex gap-2 mb-3">
            <button id="btnBlack" class="color-btn color-black active" onclick="changeColor('#DDDDDD', 'btnBlack')" aria-label="Hitam"></button>
            <button id="btnBlue"  class="color-btn color-blue"         onclick="changeColor('#CFE2FF', 'btnBlue')"  aria-label="Biru"></button>
            <button id="btnCream" class="color-btn color-cream"        onclick="changeColor('#F5E6CC', 'btnCream')" aria-label="Cream"></button>
          </div>

          <button id="btnCart" class="btn btn-cart w-100" onclick="addToCart()">Add to Cart</button>
        </div>

      </div>
    </div>
  </main>

  <!-- Bootstrap JS --->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
